name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'docker/**'
      - 'tests/**'
      - 'configs/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - 'k8s/**'
      - 'dags/**'
      - 'monitoring/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'docker/**'
      - 'tests/**'
      - 'configs/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - 'k8s/**'
      - 'dags/**'
      - 'monitoring/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: mlops-images
  IMAGE_API: cifar10-api
  IMAGE_TRAIN: cifar10-train

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pyyaml pytest fastapi httpx2 python-multipart pillow

      - name: Run tests
        run: |
          python3 -m pytest tests/ -v

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build API image
        run: |
          docker build -f docker/Dockerfile.api \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_API }}:latest \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_API }}:${{ github.sha }} \
            .

      - name: Build training image
        run: |
          docker build -f docker/Dockerfile.train \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_TRAIN }}:latest \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_TRAIN }}:${{ github.sha }} \
            .

      - name: Push API image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_API }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Push training image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_TRAIN }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_TRAIN }}:${{ github.sha }}

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install kubectl and GKE auth plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Deploy to GKE
        run: |
          if gcloud container clusters describe cifar10-cluster \
            --zone=europe-west4-a \
            --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
            echo "Cluster exists — deploying..."
            gcloud container clusters get-credentials cifar10-cluster \
              --zone=europe-west4-a \
              --project=${{ env.PROJECT_ID }}
            kubectl set image deployment/cifar10-api \
              cifar10-api=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_API }}:${{ github.sha }}
            kubectl rollout status deployment/cifar10-api
          else
            echo "GKE cluster not running — skipping deployment"
          fi

  deploy-dags:
    name: Deploy DAGs to Composer
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload DAGs to Composer
        run: |
          gsutil cp dags/*.py gs://${{ secrets.COMPOSER_BUCKET }}/dags/